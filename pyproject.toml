[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "errei"
version = "0.4.0"
description = "Auditor de artigos científicos em LaTeX (pt-BR): escrita, ABNT, referências, similaridade, indícios de IA e prontidão para periódicos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "errei contributors" }]
keywords = ["latex", "abnt", "abntex2", "revisão", "artigo científico", "qualis"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pylatexenc>=2.10,<3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
online = ["httpx>=0.27", "rapidfuzz>=3.6"]
ptbr = ["language-tool-python>=2.8", "pyspellchecker>=0.8"]
plagio = ["pypdf>=4.0"]
pdf = ["reportlab>=4.0"]
# modelo errei-cita (validação de atribuições); torch CPU: use
# --extra-index-url https://download.pytorch.org/whl/cpu para evitar o build com CUDA
modelo = ["torch>=2.1", "transformers>=4.40", "sentencepiece>=0.1.99"]
all = ["errei[online,ptbr,plagio,pdf]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
errei = "errei.cli:main"

[project.entry-points."errei.checkers"]
latex = "errei.checkers.latex:LatexChecker"
refs = "errei.checkers.refs:RefsChecker"
abnt = "errei.checkers.abnt:AbntChecker"
ptbr = "errei.checkers.ptbr:PtbrChecker"
escrita = "errei.checkers.escrita:EscritaChecker"
plagio = "errei.checkers.plagio:PlagioChecker"
ia = "errei.checkers.ia:IaChecker"
periodico = "errei.checkers.periodico:PeriodicoChecker"
completude = "errei.checkers.completude:CompletudeChecker"
nacionais = "errei.checkers.nacionais:NacionaisChecker"

[tool.hatch.build.targets.wheel]
packages = ["src/errei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network and not languagetool'"
markers = [
    "network: faz requisições reais (desligado por padrão)",
    "languagetool: requer Java + servidor LanguageTool local",
]

[tool.coverage.run]
source = ["errei"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "N817"]  # pt-BR ambíguo intencional; S = Severity

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
files = ["src/errei"]

[[tool.mypy.overrides]]
module = ["tomli", "reportlab.*", "torch.*", "transformers.*", "pylatexenc.*", "language_tool_python.*", "spellchecker.*", "pypdf.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
exclude = ["/treino/dados", "/treino/modelos", "/.venv", "/.claude", "/dist", "*.log"]
